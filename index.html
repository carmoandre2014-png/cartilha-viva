<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1F4D29" />
<title>CARtilha Viva</title>
<style>
  :root{
    --mata:#1F4D29; --folha:#3E7D44; --folhaClara:#4E8B54; --terra:#9C6B3F;
    --terraClara:#C18A52; --terraTexto:#7A4F2B; --areia:#F1EADA; --creme:#FBF8F0;
    --carvao:#2A271F; --cinza:#5E5946; --agua:#3F7E91; --alerta:#A8541E;
    /* Variáveis semânticas (tema claro) */
    --surface:#ffffff; --bg:#F1EADA; --bg2:#FBF8F0;
    --ink:#2A271F; --ink2:#5E5946; --border:#e6e0d2;
    --body1:#4E8B54; --body2:#1F4D29; --body3:#143620; --shadow:rgba(0,0,0,.08);
    --headerbg:#1F4D29; --naveutral:#5E5946;
  }
  [data-theme="dark"]{
    --surface:#23271f; --bg:#14180f; --bg2:#1c2016;
    --ink:#f1ece0; --ink2:#c6bfab; --border:#3a4130;
    --body1:#274b2f; --body2:#16301d; --body3:#0c1a10; --shadow:rgba(0,0,0,.45);
    --headerbg:#16301d; --naveutral:#c6bfab;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px;
    background: radial-gradient(circle at 30% 0%, var(--body1) 0%, var(--body2) 55%, var(--body3) 100%);
    color: var(--ink);
  }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  :focus-visible{ outline:3px solid var(--folhaClara); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.001ms !important; animation-duration:.001ms !important; scroll-behavior:auto !important; }
  }

  .device{
    position:relative; width:100%; max-width:384px; height:min(820px,94vh);
    display:flex; flex-direction:column; overflow:hidden; border-radius:28px;
    background: var(--bg); box-shadow:0 25px 60px rgba(0,0,0,.45);
  }

  /* Header */
  .header{ position:sticky; top:0; z-index:10; padding:12px 16px 12px; background:var(--headerbg); box-shadow:0 6px 16px rgba(0,0,0,.18); }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .header-tools{ display:flex; align-items:center; gap:6px; }
  .iconbtn{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); color:#fff; transition:transform .15s; }
  .iconbtn:active{ transform:scale(.94); }
  .toolmini{ height:38px; min-width:38px; padding:0 10px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:5px; background:rgba(255,255,255,.18); color:#fff; font-size:13px; font-weight:700; }
  .langwrap{ position:relative; }
  .langmenu{ position:absolute; right:0; top:44px; background:var(--surface); color:var(--ink); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.3); padding:6px; z-index:30; min-width:150px; }
  .langmenu button{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:10px 12px; border-radius:10px; font-size:15px; font-weight:600; color:var(--ink); }
  .langmenu button.on{ background:var(--bg); color:var(--mata); }
  .offline-pill{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; background:rgba(255,255,255,.22); color:#fff; }
  .offline-pill.online{ background:rgba(120,220,150,.28); }
  .h1{ margin:8px 0 0; font-size:20px; font-weight:800; color:#fff; line-height:1.25; outline:none; }
  .subtitle{ margin:2px 0 0; font-size:14px; color:#fff; opacity:.92; }

  /* Main */
  .main{ flex:1; overflow-y:auto; padding:16px; padding-bottom:96px; }

  /* Bottom nav */
  .bottomnav{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-around; padding:8px 8px 12px; background:var(--bg2); border-top:2px solid var(--border); }
  .navbtn{ min-width:64px; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:16px; font-size:12px; font-weight:600; color:var(--ink2); transition:transform .15s; }
  .navbtn:active{ transform:scale(.94); }
  .navbtn.active{ color:var(--folhaClara); }

  /* Cards */
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card{ min-height:124px; background:var(--surface); border-radius:16px; padding:16px; text-align:left; box-shadow:0 2px 6px var(--shadow); transition:transform .15s; }
  .card:active{ transform:scale(.96); }
  .card-ico{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .card .t{ font-weight:700; font-size:16px; line-height:1.15; color:var(--ink); }
  .card .d{ font-size:14px; line-height:1.25; color:var(--ink2); margin-top:2px; }
  .saudacao{ font-size:15px; font-weight:700; color:var(--mata); background:var(--surface); border:2px solid var(--folhaClara); border-radius:14px; padding:10px 12px; margin-bottom:12px; }
  [data-theme="dark"] .saudacao{ color:var(--folhaClara); }

  .banner{ margin-top:12px; width:100%; min-height:64px; display:flex; align-items:center; gap:12px; background:var(--mata); color:#fff; border-radius:16px; padding:16px; text-align:left; transition:transform .15s; }
  .banner:active{ transform:scale(.97); }
  .banner .t{ font-weight:700; }
  .banner .d{ font-size:14px; opacity:.92; }

  .link-sobre{ margin-top:12px; width:100%; min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:16px; background:var(--surface); color:var(--terraTexto); border:2px solid var(--terraClara); font-weight:600; font-size:14px; padding:8px; }
  [data-theme="dark"] .link-sobre{ color:var(--terraClara); }

  /* Chat */
  .trust{ display:flex; gap:8px; background:var(--surface); border:2px solid var(--folhaClara); border-radius:16px; padding:12px; font-size:14px; margin-bottom:12px; color:var(--ink); }
  .msgs{ display:flex; flex-direction:column; gap:12px; }
  .bubble-row{ display:flex; gap:8px; }
  .bubble-row.user{ justify-content:flex-end; }
  .bubble{ max-width:80%; border-radius:16px; padding:12px 16px; font-size:16px; line-height:1.5; box-shadow:0 2px 6px var(--shadow); }
  .bubble.ze{ background:var(--surface); color:var(--ink); }
  .bubble.user{ background:var(--folha); color:#fff; }
  .resp{ max-width:85%; background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); color:var(--ink); }
  .resp .ex{ margin-top:12px; background:var(--bg); border-radius:12px; padding:12px; font-size:14px; line-height:1.5; }
  .resp .lei{ margin:8px 0 0; font-size:14px; font-weight:600; color:var(--terraTexto); }
  [data-theme="dark"] .resp .lei{ color:var(--terraClara); }
  .resp .fonte{ margin:4px 0 0; font-size:12px; color:var(--ink2); display:flex; align-items:center; gap:4px; }
  .resp .rn{ margin-top:12px; display:flex; flex-direction:column; gap:4px; font-size:14px; }
  .resp .ok{ color:var(--folha); display:flex; align-items:center; gap:4px; }
  .resp .no{ color:var(--alerta); display:flex; align-items:center; gap:4px; }
  [data-theme="dark"] .resp .ok{ color:#6fbf78; }
  [data-theme="dark"] .resp .no{ color:#e08a52; }
  .ouvindo{ display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; color:var(--folhaClara); }

  .inputbar-wrap{ position:absolute; left:0; right:0; bottom:76px; padding:8px 12px; background:var(--bg); }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip{ flex:0 0 auto; min-height:44px; border-radius:999px; padding:8px 12px; font-size:14px; font-weight:600; background:var(--surface); color:var(--mata); border:2px solid var(--folhaClara); }
  [data-theme="dark"] .chip{ color:var(--folhaClara); }
  .inputrow{ margin-top:8px; display:flex; align-items:center; gap:8px; }
  .input{ flex:1; min-height:50px; border-radius:999px; padding:0 16px; font-size:16px; background:var(--surface); color:var(--ink); border:2px solid var(--folhaClara); }
  .roundbtn{ width:50px; height:50px; flex:0 0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; transition:transform .15s; }
  .roundbtn:active{ transform:scale(.94); }

  /* Diagnóstico */
  .progress{ width:100%; height:10px; border-radius:999px; background:var(--surface); margin-bottom:20px; overflow:hidden; border:1px solid var(--border); }
  .progress .bar{ height:10px; border-radius:999px; background:var(--folha); transition:width .3s; }
  .q-title{ font-size:24px; font-weight:800; margin:0 0 8px; color:var(--ink); }
  .q-dica{ font-size:14px; color:var(--ink2); margin:0 0 18px; line-height:1.4; }
  .opt{ width:100%; min-height:64px; border-radius:16px; padding:0 20px; text-align:left; font-size:18px; font-weight:600; background:var(--surface); color:var(--ink); border:2px solid var(--terraClara); box-shadow:0 2px 6px var(--shadow); transition:transform .15s; margin-bottom:12px; display:flex; align-items:center; }
  .opt:active{ transform:scale(.97); }
  .result-item{ display:flex; gap:12px; background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); margin-bottom:12px; color:var(--ink); }
  .result-ico{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .result-item p{ margin:0; font-size:16px; line-height:1.3; }
  .basenote{ font-size:12px; color:var(--ink2); display:flex; align-items:center; gap:4px; margin:12px 0 0; }
  .note{ font-size:14px; background:var(--surface); color:var(--ink); border:2px solid var(--terraClara); border-radius:16px; padding:12px; margin:8px 0 0; }

  .cta{ width:100%; min-height:56px; border-radius:16px; font-size:16px; font-weight:700; color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); transition:transform .15s; margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .cta:active{ transform:scale(.97); }
  .textbtn{ width:100%; min-height:44px; border-radius:12px; font-size:16px; font-weight:600; color:var(--terraTexto); margin-top:12px; }
  [data-theme="dark"] .textbtn{ color:var(--terraClara); }

  /* Resumo */
  .resumo{ background:var(--surface); border-radius:16px; padding:20px; box-shadow:0 2px 6px var(--shadow); color:var(--ink); }
  .resumo h2{ margin:0 0 4px; font-size:20px; font-weight:800; color:var(--folhaClara); }
  .resumo .lead{ font-size:14px; color:var(--ink2); margin:0 0 16px; }
  .resumo .box{ background:var(--bg); border-radius:12px; padding:12px; margin-bottom:12px; }
  .resumo .box p{ margin:0; font-size:14px; }
  .resumo ul{ margin:0 0 12px; padding-left:0; list-style:none; }
  .resumo li{ font-size:14px; display:flex; gap:8px; align-items:flex-start; margin-bottom:4px; }

  /* Trilha */
  .selos{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin:0 0 4px; }
  .selos .lbl{ font-size:16px; font-weight:600; margin-right:4px; color:var(--ink); }
  .hint{ font-size:14px; color:var(--ink2); margin:0 0 16px; }
  .trilha-prog{ background:var(--surface); border-radius:14px; padding:12px; box-shadow:0 2px 6px var(--shadow); margin-bottom:14px; }
  .trilha-prog .pl{ font-size:14px; font-weight:700; color:var(--ink); margin:0 0 8px; display:flex; justify-content:space-between; }
  .lesson{ width:100%; min-height:68px; display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:16px; padding:16px; text-align:left; box-shadow:0 2px 6px var(--shadow); transition:transform .15s; margin-bottom:12px; color:var(--ink); }
  .lesson:active{ transform:scale(.97); }
  .lesson.locked{ opacity:.7; }
  .lesson-ico{ flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .lesson .t{ font-weight:700; font-size:16px; }
  .lesson .s{ font-size:14px; font-weight:600; }
  .lcard{ background:var(--surface); border-radius:16px; padding:20px; box-shadow:0 2px 6px var(--shadow); margin-bottom:16px; color:var(--ink); }
  .lcard h2{ margin:0 0 8px; font-size:20px; font-weight:800; color:var(--folhaClara); }
  .lcard p{ margin:0; font-size:18px; line-height:1.5; }
  .lcard .intro{ font-size:17px; line-height:1.5; margin:0 0 12px; }
  .lcard ul.pontos{ margin:0 0 12px; padding-left:0; list-style:none; }
  .lcard ul.pontos li{ display:flex; gap:8px; align-items:flex-start; font-size:16px; line-height:1.45; margin-bottom:8px; }
  .lcard .exemplo{ background:var(--bg); border-radius:12px; padding:12px; font-size:15px; line-height:1.5; }
  .quizcard{ background:var(--surface); border-radius:16px; padding:20px; box-shadow:0 2px 6px var(--shadow); color:var(--ink); }
  .quizcard .q{ font-size:18px; font-weight:700; margin:0 0 16px; }
  .quizopt{ width:100%; min-height:56px; border-radius:16px; padding:0 16px; text-align:left; font-size:16px; font-weight:600; background:var(--surface); color:var(--ink); border:2px solid var(--terraClara); margin-bottom:12px; display:flex; align-items:center; }
  .feedback{ font-size:16px; font-weight:600; margin:16px 0 12px; }

  /* Benefícios */
  .ben{ width:100%; background:var(--surface); border-radius:16px; padding:16px; text-align:left; box-shadow:0 2px 6px var(--shadow); transition:transform .15s; margin-bottom:12px; color:var(--ink); }
  .ben:active{ transform:scale(.98); }
  .ben-head{ display:flex; align-items:center; gap:12px; }
  .ben-ico{ flex:0 0 auto; width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .ben .t{ font-weight:700; font-size:16px; }
  .ben .d{ font-size:14px; line-height:1.25; color:var(--ink2); }
  .ben-expand{ display:block; margin-top:12px; background:var(--bg); border-radius:12px; padding:12px; font-size:14px; line-height:1.5; color:var(--ink); }

  /* Cápsulas */
  .capsule{ min-height:320px; border-radius:24px; padding:24px; display:flex; flex-direction:column; align-items:center; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .capsule-ico{ width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:20px; background:rgba(255,255,255,.24); }
  .capsule-frase{ font-size:24px; font-weight:800; color:#fff; line-height:1.25; }
  .cap-share{ margin-top:24px; width:100%; min-height:56px; border-radius:16px; font-size:18px; font-weight:700; background:#fff; display:flex; align-items:center; justify-content:center; gap:8px; }
  .cap-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; }
  .cap-arrow{ width:52px; height:52px; border-radius:50%; background:var(--surface); color:var(--mata); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .dots{ display:flex; gap:8px; }
  .dot{ width:10px; height:10px; border-radius:50%; }

  /* Sobre */
  .sobre-item{ display:flex; gap:12px; background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); margin-bottom:12px; color:var(--ink); }
  .sobre-ico{ flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .sobre-item .t{ font-weight:700; font-size:16px; }
  .sobre-item .d{ font-size:14px; line-height:1.25; color:var(--ink2); }
  .sobre-note{ font-size:12px; color:var(--ink2); text-align:center; margin-top:16px; }

  /* Onboarding */
  .onboarding{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px; background:linear-gradient(160deg,var(--bg2) 0%, var(--bg) 100%); }
  .ob-top{ display:flex; justify-content:space-between; align-items:center; width:100%; gap:8px; }
  .ob-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ob-ze{ width:150px; height:150px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; margin-bottom:24px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .ob-title{ font-size:30px; font-weight:800; color:var(--folhaClara); margin:0 0 12px; outline:none; }
  .ob-text{ font-size:18px; line-height:1.5; max-width:300px; color:var(--ink); margin:0; }
  .ob-dots{ display:flex; gap:8px; margin:24px 0; }
  .ob-dot{ height:10px; border-radius:999px; transition:width .2s; }
  .ob-actions{ width:100%; }
  .ob-primary{ width:100%; min-height:58px; border-radius:16px; font-size:18px; font-weight:700; background:var(--mata); color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); }
  .offline-dark{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:4px 12px; font-size:12px; font-weight:600; background:var(--surface); color:var(--mata); }
  [data-theme="dark"] .offline-dark{ color:var(--folhaClara); }
  .ob-tools{ display:flex; align-items:center; gap:6px; }
  .ob-tool{ height:36px; min-width:36px; padding:0 10px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:5px; background:var(--surface); color:var(--mata); font-size:13px; font-weight:700; box-shadow:0 2px 6px var(--shadow); }
  [data-theme="dark"] .ob-tool{ color:var(--folhaClara); }

  /* Links e biblioteca */
  a{ color:var(--mata); }
  [data-theme="dark"] a{ color:var(--folhaClara); }
  .a-inline{ color:var(--mata); font-weight:600; text-decoration:underline; display:inline-flex; align-items:center; gap:4px; }
  [data-theme="dark"] .a-inline{ color:var(--folhaClara); }
  .lib-item{ background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); margin-bottom:12px; color:var(--ink); }
  .lib-item .t{ font-weight:700; font-size:16px; }
  .lib-item .ref{ font-size:13px; color:var(--terraTexto); font-weight:600; }
  [data-theme="dark"] .lib-item .ref{ color:var(--terraClara); }
  .lib-item .d{ font-size:14px; color:var(--ink2); line-height:1.3; margin:4px 0 10px; }
  .lib-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .lib-btn{ min-height:44px; padding:8px 14px; border-radius:12px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
  .lib-btn.primary{ background:var(--mata); color:#fff; }
  .lib-btn.ghost{ background:var(--surface); color:var(--mata); border:2px solid var(--folhaClara); }
  [data-theme="dark"] .lib-btn.ghost{ color:var(--folhaClara); }
  .toolbar{ position:sticky; top:0; z-index:5; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--bg); padding:4px 0 12px; }
  .toolbtn{ min-height:44px; min-width:44px; padding:8px 12px; border-radius:12px; background:var(--surface); border:2px solid var(--folhaClara); color:var(--mata); font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  [data-theme="dark"] .toolbtn{ color:var(--folhaClara); }
  .toolbtn.on{ background:var(--mata); color:#fff; border-color:var(--mata); }
  .lei-sec{ background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); margin-bottom:12px; color:var(--ink); }
  .lei-sec h3{ margin:0 0 6px; color:var(--folhaClara); font-size:1.15em; line-height:1.25; }
  .lei-sec p{ margin:0; line-height:1.72; }
  .lei-link{ font-weight:700; color:var(--mata); text-decoration:underline; }
  [data-theme="dark"] .lei-link{ color:var(--folhaClara); }

  /* Gamificação: Sementes */
  .carteira-big{ display:flex; gap:12px; align-items:center; background:var(--surface); border:2px solid var(--folhaClara); border-radius:16px; padding:14px; margin-bottom:14px; color:var(--ink); }
  .carteira-big .d{ font-size:13px; color:var(--ink2); line-height:1.35; }
  .roca-box{ background:var(--surface); border-radius:16px; padding:14px; box-shadow:0 2px 6px var(--shadow); text-align:center; margin-bottom:14px; }
  .roca-nome{ font-weight:800; font-size:18px; color:var(--folhaClara); margin:6px 0 10px; }
  .dica-card{ display:flex; gap:12px; align-items:flex-start; background:var(--bg2); border:2px solid var(--terraClara); border-radius:16px; padding:14px; margin-bottom:16px; color:var(--ink); }
  .dica-card .d{ font-size:14px; color:var(--ink); line-height:1.4; margin:4px 0 10px; }
  .sec-h{ font-size:16px; font-weight:800; color:var(--ink); margin:6px 0 10px; }
  .ganho{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .ganho-row{ display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:12px; min-height:44px; color:var(--ink); }
  .ganho-row .d{ font-size:13px; color:var(--ink2); }
  .selos-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .selo-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1.5px solid var(--terraClara); color:var(--terraTexto); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; }
  [data-theme="dark"] .selo-chip{ color:var(--terraClara); }
  .premio{ background:var(--surface); border-radius:16px; padding:14px; box-shadow:0 2px 6px var(--shadow); margin-bottom:12px; color:var(--ink); }
  .premio-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .premio-nome{ font-weight:700; font-size:15px; line-height:1.3; }
  .premio-custo{ flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; font-weight:800; color:var(--folhaClara); }
  .premio .d{ font-size:14px; color:var(--ink2); line-height:1.35; margin:6px 0 4px; }
  .resg-item{ display:flex; gap:8px; align-items:flex-start; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:14px; color:var(--ink); }

  /* Regras do jogo */
  .regra-card{ background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); margin-bottom:14px; color:var(--ink); }
  .regra-card h2{ margin:0 0 10px; font-size:17px; font-weight:800; color:var(--folhaClara); display:flex; align-items:center; gap:8px; }
  .regra-tab{ width:100%; border-collapse:collapse; font-size:14px; }
  .regra-tab th,.regra-tab td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  .regra-tab th{ color:var(--ink2); font-weight:700; }
  .regra-tab td.val{ text-align:right; font-weight:800; color:var(--folhaClara); white-space:nowrap; }
  .estagio-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .estagio-row:last-child{ border-bottom:none; }
  .estagio-row .nm{ font-weight:700; }
  .estagio-row .lm{ margin-left:auto; font-weight:800; color:var(--terraTexto); }
  [data-theme="dark"] .estagio-row .lm{ color:var(--terraClara); }
  .premio-camada{ margin-bottom:6px; font-size:14px; line-height:1.45; }
  .premio-camada strong{ color:var(--ink); }

  /* Notas e gravação */
  .notas-intro{ display:flex; gap:10px; background:var(--surface); border:2px solid var(--folhaClara); border-radius:16px; padding:12px; margin-bottom:14px; font-size:14px; line-height:1.4; color:var(--ink); }
  .notas-area{ width:100%; min-height:160px; border-radius:16px; padding:14px; font-size:16px; line-height:1.5; background:var(--surface); color:var(--ink); border:2px solid var(--terraClara); resize:vertical; font-family:inherit; }
  .gravador{ background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 2px 6px var(--shadow); margin-top:14px; color:var(--ink); }
  .gravador h2{ font-size:16px; font-weight:800; margin:0 0 6px; color:var(--ink); }
  .grav-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .grav-btn{ min-height:50px; padding:0 16px; border-radius:14px; font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:8px; color:#fff; }
  .grav-status{ font-size:14px; font-weight:700; color:var(--alerta); display:flex; align-items:center; gap:6px; margin-top:6px; }
  [data-theme="dark"] .grav-status{ color:#e08a52; }
  .audio-item{ display:flex; gap:8px; align-items:center; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px; margin-top:10px; flex-wrap:wrap; }
  .audio-item audio{ flex:1; min-width:160px; }
  .audio-del{ min-height:40px; padding:0 12px; border-radius:10px; background:var(--surface); border:2px solid var(--terraClara); color:var(--terraTexto); font-weight:700; font-size:13px; }
  [data-theme="dark"] .audio-del{ color:var(--terraClara); }

  /* Toast */
  .toast{ position:absolute; left:50%; bottom:92px; transform:translateX(-50%); width:85%; padding:12px 16px; border-radius:16px; text-align:center; font-size:14px; font-weight:600; background:var(--carvao); color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  [data-theme="dark"] .toast{ background:#3a4130; }
  .saud-row{ display:flex; gap:8px; align-items:stretch; margin-bottom:12px; }
  .seedchip{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-width:66px; border-radius:14px; background:var(--mata); color:#fff; font-weight:800; font-size:15px; padding:6px 10px; }
  .weather-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:2px solid var(--folhaClara); border-radius:14px; padding:12px; margin-bottom:12px; color:var(--ink); }
  .weather-card .wt{ font-size:22px; font-weight:800; color:var(--ink); }
  .weather-card .wd{ font-size:12px; color:var(--ink2); line-height:1.3; }
  .weather-ico{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .sharemask{ position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:40; }
  .sharesheet{ position:absolute; left:0; right:0; bottom:0; z-index:41; background:var(--surface); border-radius:20px 20px 0 0; padding:16px; box-shadow:0 -8px 24px rgba(0,0,0,.3); }
  .sharetit{ font-size:15px; font-weight:800; color:var(--ink); margin:0 0 10px; text-align:center; }
  .shareopt{ width:100%; min-height:52px; display:flex; align-items:center; gap:12px; padding:0 16px; border-radius:14px; background:var(--bg); color:var(--ink); font-size:16px; font-weight:600; margin-bottom:8px; }
  .shareclose{ width:100%; min-height:48px; border-radius:14px; background:var(--mata); color:#fff; font-weight:700; font-size:15px; margin-top:4px; }

function D(){ return I18N[state.lang] || I18N.pt; }

function fmt(str, obj){
  if(str==null) return "";
  return String(str).replace(/\{(\w+)\}/g, function(m,k){ return (obj && obj[k]!=null) ? obj[k] : m; });
}

function saudacao(){
  var h = new Date().getHours();
  var s = D().saud;
  if(h>=5 && h<12) return s.manha;
  if(h>=12 && h<18) return s.tarde;
  return s.noite;
}
function aplicarTema(){
  try{
    if(state.theme==="dark") document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute("content", state.theme==="dark" ? "#16301d" : "#1F4D29");
  }catch(e){}
}
function aplicarLang(){ try{ document.documentElement.lang = (state.lang==="pt"?"pt-BR":state.lang); }catch(e){} }

function trocarTema(){
  state.theme = (state.theme==="dark" ? "light" : "dark");

function montarResultado(r){
  var R=D().diagRes, itens=[];
  if(r.rio===0) itens.push({tipo:"agua", texto:R.rioSim});
  else if(r.rio===2) itens.push({tipo:"info", texto:R.rioNaoSei});
  if(r.bioma===0) itens.push({tipo:"ok", texto:R.biomaAmazonia});
  else if(r.bioma===1) itens.push({tipo:"ok", texto:R.biomaCerrado});
  else itens.push({tipo:"ok", texto:R.biomaOutro});
  if(r.modulos===2) itens.push({tipo:"info", texto:R.modGrande});
  else itens.push({tipo:"ok", texto:R.modPequeno});
  if(r.desmate===1) itens.push({tipo:"alerta", texto:R.desmateDepois});
  else if(r.desmate===0) itens.push({tipo:"ok", texto:R.desmateAntes});
  return itens;
}

function licaoDesbloqueada(id){ return id===1 || state.feitas.indexOf(id-1)>=0; }
function licaoConcluida(id){ return state.feitas.indexOf(id)>=0; }

function screenTrilha(){
  if(state.licaoAberta===null){
    var selos='<span class="lbl">'+esc(t("seusSelos"))+'</span>';
    for(var i=0;i<LICAO_IDS.length;i++){
      var feito=licaoConcluida(LICAO_IDS[i]);
      selos+=icon("star",22, feito?C.terra:"#b8b1a0", feito?C.terraClara:"none");
    }
    var prog = Math.round((state.feitas.length/LICAO_IDS.length)*100);
    var progCard='<div class="trilha-prog"><p class="pl"><span>'+esc(fmt(t("trilhaProgresso"),{x:state.feitas.length,y:LICAO_IDS.length}))+'</span><span>'+state.feitas.length+'/'+LICAO_IDS.length+'</span></p>'+
      '<div class="progress" role="progressbar" aria-valuenow="'+state.feitas.length+'" aria-valuemin="0" aria-valuemax="'+LICAO_IDS.length+'"><div class="bar" style="width:'+prog+'%"></div></div></div>';
    var lista="";
    for(var j=0;j<LICAO_IDS.length;j++){
      var id=LICAO_IDS[j], lic=D().licoes[id];
      var concl=licaoConcluida(id), aberta=licaoDesbloqueada(id);
      var estado = concl?"concluida":(aberta?"disponivel":"bloqueada");
      var estLbl = concl?t("estConcluida"):(aberta?t("estAbrir"):t("estBloqueada"));
      var icoBg = concl?C.folha : (aberta?C.terra : "#b8b1a0");
      var ic = concl?icon("check",22,"#fff") : (aberta?icon("play",20,"#fff","#fff") : icon("lock",20,"#fff"));
      var sub = concl?t("concluidaRever") : (aberta?t("toqueAbrir") : t("bloqueadaTxt"));
      var subCor = concl?C.folha : (aberta?P().terraTx : P().ink2);
      var onclick = (aberta||concl) ? "abrirLicao("+id+")" : "avisoBloqueada()";
      lista+='<button class="lesson'+(estado==="bloqueada"?" locked":"")+'" onclick="'+onclick+'" '+(estado==="bloqueada"?'aria-disabled="true" ':'')+'aria-label="'+esc(fmt(t("abrirLicaoAria"),{id:id,t:lic.titulo,est:estLbl}))+'">'+
        '<span class="lesson-ico" style="background:'+icoBg+'">'+ic+'</span>'+
        '<span class="lesson-txt"><span class="t">'+id+'. '+esc(lic.titulo)+'</span><br>'+
        '<span class="s" style="color:'+subCor+'">'+esc(sub)+'</span></span></button>';
    }
    return header(t("trilhaTitulo"),t("trilhaSub"),"go('inicio')")+
      '<main class="main">'+progCard+'<p class="selos" aria-label="'+esc(fmt(t("conclLicoes"),{x:state.feitas.length,y:LICAO_IDS.length}))+'">'+selos+'</p>'+
      '<p class="hint">'+esc(t("hintTrilha"))+'</p>'+lista+'</main>'+bottomnav("trilha");
  } else {
    var id2=state.licaoAberta, lic2=D().licoes[id2], q=D().quiz[id2], certa=QUIZ_CERTA[id2];
    var pontos="";
    for(var p=0;p<lic2.pontos.length;p++){ pontos+='<li>'+icon("check",18,C.folha)+' <span>'+esc(lic2.pontos[p])+'</span></li>'; }
    var inner='<div class="lcard"><h2>'+id2+'. '+esc(lic2.titulo)+'</h2>'+
      '<p class="intro">'+esc(lic2.intro)+'</p>'+
      '<p style="font-weight:700;margin:0 0 6px;color:'+P().ink+'">'+esc(t("pontosChave"))+'</p>'+
      '<ul class="pontos">'+pontos+'</ul>'+
      '<div class="exemplo"><strong>'+esc(t("exemploLbl"))+'</strong>'+esc(lic2.exemplo)+'</div></div>';
    if(state.faseQuiz==="conteudo"){
      inner+=cta(C.folha,"setFase('quiz')",esc(t("fazerDesafio")));
    } else {
      var opts="";
      for(var o=0;o<q.opcoes.length;o++){
        var bg="var(--surface)", bd=C.terraClara;
        if(state.escolhaQuiz!==null && o===certa){ bg= state.theme==="dark"?"#1f3a26":"#e7f3e8"; bd=C.folha; }
        else if(state.escolhaQuiz===o && o!==certa){ bg= state.theme==="dark"?"#3a2a1f":"#f7e6db"; bd=C.alerta; }
        var dis = state.escolhaQuiz!==null ? "disabled" : "";
        opts+='<button class="quizopt" style="background:'+bg+';border-color:'+bd+'" '+dis+' onclick="escolherQuiz('+o+')">'+esc(q.opcoes[o])+'</button>';
      }
      var fb="";
      if(state.escolhaQuiz!==null){
        var acertou=(state.escolhaQuiz===certa);
        if(acertou){
          fb='<div role="status"><p class="feedback" style="color:'+C.folha+'">'+esc(t("quizIsso"))+'</p>'+
            cta(C.mata,"concluirLicao("+id2+")",esc(t("concluirLicaoBtn")))+'</div>';
        } else {
          fb='<div role="status"><p class="feedback" style="color:'+C.alerta+'">'+esc(t("quizQuase"))+'</p>'+
            cta(C.terra,"tentarQuiz()",esc(t("quizTentar")))+'</div>';
        }
      }
      inner+='<div class="quizcard"><p class="q">'+esc(q.p)+'</p>'+opts+fb+'</div>';
    }
    return header(t("trilhaTitulo"),t("trilhaSub"),"licaoBack()")+
      '<main class="main">'+inner+'</main>'+bottomnav("trilha");
  }
}

function b64utf8(b){ try{ return decodeURIComponent(escape(window.atob(b))); }catch(e){ try{ return window.atob(b); }catch(e2){ return ""; } } }
function leiIntegraHTML(id){
  var b=LEIS_INTEGRA[id]; if(!b) return "";
  var txt=b64utf8(b); if(!txt) return "";
  var ps=txt.split(/\n\n+/);
  var out='<div class="lei-sec"><h3>'+esc(t("integraTitulo"))+'</h3>'+
    '<p style="font-size:.85em;color:'+P().ink2+';margin:0 0 10px">'+esc(t("integraNota"))+'</p>';
  for(var i=0;i<ps.length;i++){ var p=ps[i].trim(); if(p){ out+='<p style="margin:0 0 10px">'+esc(p)+'</p>'; } }
  return out+'</div>';
}
function screenLeitura(){
  var meta=null, l=null;
  for(var i=0;i<LEIS_META.length;i++){ if(LEIS_META[i].id===state.leiAberta){ meta=LEIS_META[i]; l=D().leis[meta.id]; } }
  var fpx=Math.round(16*state.libFonte);
  var secs="";
  for(var j=0;j<l.secoes.length;j++){
    secs+='<div class="lei-sec"><h3>'+esc(l.secoes[j].t)+'</h3><p>'+esc(l.secoes[j].c)+'</p></div>';
  }
  var temVoz = ('speechSynthesis' in window);
  var toolbar='<div class="toolbar">'+
    '<button class="toolbtn" aria-label="A-" onclick="zoomLei(-1)">'+icon("file",16,P().brand)+' A-</button>'+
    '<button class="toolbtn" aria-label="A+" onclick="zoomLei(1)">'+icon("file",18,P().brand)+' A+</button>'+
    (temVoz
      ? '<button class="toolbtn'+(state.lendo?' on':'')+'" aria-label="'+esc(state.lendo?t("parar"):t("ouvir"))+'" onclick="lerEmVoz()">'+icon("volume",18,state.lendo?'#fff':P().brand)+' '+esc(state.lendo?t("parar"):t("ouvir"))+'</button>'
      : '')+
    '</div>';
  return header(l.titulo, meta.ref, "fecharLei()")+
    '<main class="main" style="padding-bottom:120px">'+toolbar+
    '<div style="font-size:'+fpx+'px">'+
    '<div class="lei-sec"><p style="margin:0">'+esc(l.resumo)+'</p></div>'+
    secs+
    (LEIS_INTEGRA[meta.id]?leiIntegraHTML(meta.id):'')+
    '<div class="lei-sec"><a class="lei-link" href="'+meta.link+'" target="_blank" rel="noopener noreferrer">'+icon("link",18,P().brand)+' '+esc(t("abrirOficial"))+'</a>'+
    '<p style="margin:8px 0 0;font-size:.85em;color:'+P().ink2+'">'+esc(fmt(t("leituraNota"),{data:D().dataBase}))+'</p></div>'+
    '</div></main>'+bottomnav("biblioteca");
}

function roca(){
  var s=state.sementes;
  for(var i=0;i<ROCA_LIMIARES.length;i++){
    if(s>=ROCA_LIMIARES[i].min){
      var n=ROCA_LIMIARES[i].n;
      return {n:n, nome:D().rocaEstagios[n-1], prox:ROCA_LIMIARES[i].prox};
    }
  }
  return {n:1, nome:D().rocaEstagios[0], prox:20};
}
function selosHTMLlista(){
  var keys = Object.keys(state.selos);
  if(!keys.length) return '<span class="hint">'+esc(t("semSelos"))+'</span>';
  var out="";
  for(var i=0;i<keys.length;i++){
    var lbl = D().selos[keys[i]] || keys[i];
    out+='<span class="selo-chip">'+icon("star",15,C.terra,C.terraClara)+' '+esc(lbl)+'</span>';
  }
  return out;
}
function screenRoca(){
  var r=roca();
  var falta = r.prox ? (r.prox - state.sementes) : 0;
  var prog = r.prox ? Math.min(100, Math.round((state.sementes/r.prox)*100)) : 100;
  var dica = D().dicas[state.sequencia % D().dicas.length];
  return header(t("rocaTitulo"),t("rocaSub"),"go('inicio')")+
    '<main class="main">'+
    '<div class="carteira-big">'+icon("sprout",26,P().brand)+'<span><strong>'+esc(fmt(t("sementesLabel"),{n:state.sementes}))+'</strong><br><span class="d">'+esc(fmt(t("sequenciaTxt"),{n:state.sequencia}))+'</span></span></div>'+

    '<div class="roca-box">'+rocaSVG(r.n)+'<p class="roca-nome">'+esc(r.nome)+'</p>'+
      (r.prox?'<div class="progress"><div class="bar" style="width:'+prog+'%"></div></div><p class="hint">'+esc(fmt(t("faltamProx"),{n:falta}))+'</p>':'<p class="hint">'+esc(t("rocaTopo"))+'</p>')+
    '</div>'+
    '<div class="dica-card">'+icon("sparkles",20,P().terraTx)+'<div><strong>'+esc(t("dicaTitulo"))+'</strong><p class="d">'+esc(dica)+'</p>'+
      (state.dicaHoje?'<span class="hint">'+esc(t("jaSomou"))+'</span>':'<button class="lib-btn primary" onclick="verDica()">'+icon("check",16,"#fff")+' '+esc(fmt(t("verDica"),{n:PONTOS.dica}))+'</button>')+

    '<rect x="3" y="19" width="18" height="3" rx="1.5" fill="'+C.terra+'"/>'+

function matchPergunta(txt){
  var s=(txt||"").toLowerCase();
  function has(){ for(var i=0;i<arguments.length;i++){ if(s.indexOf(arguments[i])>=0) return true; } return false; }
  if(has("cra","cota de reserva","reserva ambiental","quota","negociar mata","vender mata","título","titulo")) return "cra";
  if(has("pra","regulariz","recompor","recompo","recuper","reflorest","replant","programa de regular","ficar em dia","me adequar","passivo")) return "pra";
  if(has("benef","crédito","credito","financ","empréstimo","emprestimo","banco","vantagem","carbono","psa","pagamento por servi","o que ganho","o que eu ganho","ganho ao")) return "beneficios";
  if(has("reserva legal","reserva","20%","80%","percentual","quanto de mata","quanto de vegeta")) return "reserva";
  if(has("app","área de preserva","area de preserva","preserva permanente","nascente","beira do rio","margem","mata cili","ribeir","curso de água","curso d","faixa de mata","encosta","topo de morro")) return "app";
  if(has("car","cadastro ambiental","sicar","fazer o car","faço o car","inscriç","inscri")) return "app";
  return null;
}

function langBCP(){ return state.lang==="pt"?"pt-BR":(state.lang==="es"?"es-ES":"en-US"); }
function lerEmVoz(){
  if(!('speechSynthesis' in window)){ showToast(t("semVoz")); return; }
  if(state.lendo){ pararLeitura(); render(); return; }
  var meta=null, l=null;
  for(var i=0;i<LEIS_META.length;i++){ if(LEIS_META[i].id===state.leiAberta){ meta=LEIS_META[i]; l=D().leis[meta.id]; } }
  if(!l) return;
  var partes=[l.titulo+", "+meta.ref+".", l.resumo];
  for(var j=0;j<l.secoes.length;j++){ partes.push(l.secoes[j].t+". "+l.secoes[j].c); }
  var texto=partes.join(" ");
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(texto);
    u.lang=langBCP(); u.rate=0.95;
    var pref = state.lang;
    var vs=window.speechSynthesis.getVoices()||[];
    var match=vs.filter(function(v){ return new RegExp("^"+pref,"i").test(v.lang); });
    if(match.length){ u.voice=match[0]; }
    else if(state.lang==="pt" && vs.length){ showToast(t("semVozPt")); }
    u.onend=function(){ state.lendo=false; render(); };
    u.onerror=function(){ state.lendo=false; render(); };
    window.speechSynthesis.speak(u);
    state.lendo=true; render();
  }catch(e){ showToast(t("leituraErro")); }
}

/* ----- Notas e gravação de áudio ----- */
function salvarNota(v){ state.notas=v; lsSet("notas", v); }
function iniciarGravacao(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder!=="undefined")){
    showToast(t("gravSemSuporte")); return;
  }
  try{
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      mediaStream=stream; gravChunks=[];
      try{ mediaRec=new MediaRecorder(stream); }
      catch(e){ pararStream(); showToast(t("gravSemSuporte")); return; }
      mediaRec.ondataavailable=function(ev){ if(ev.data && ev.data.size>0) gravChunks.push(ev.data); };
      mediaRec.onstop=function(){
        try{
          var blob=new Blob(gravChunks, {type:(mediaRec && mediaRec.mimeType)||"audio/webm"});
          var url=URL.createObjectURL(blob);
          state.gravacoes.push({id:gravSeq++, url:url});
        }catch(e){}
        pararStream(); state.gravando=false; render();
      };
      mediaRec.start();
      state.gravando=true; render();
    }).catch(function(){ pararStream(); state.gravando=false; showToast(t("gravSemPermissao")); render(); });
  }catch(e){ showToast(t("gravSemPermissao")); }
}
function pararGravacao(){
  try{ if(mediaRec && mediaRec.state==="recording"){ mediaRec.stop(); return; } }catch(e){}
  pararStream(); state.gravando=false; render();
}
function pararStream(){
  try{ if(mediaStream){ mediaStream.getTracks().forEach(function(tr){ tr.stop(); }); } }catch(e){}
  mediaStream=null;
}
function reproduzirAudio(id){ try{ var el=document.getElementById("aud_"+id); if(el){ el.currentTime=0; el.play(); } }catch(e){} }
function apagarAudio(id){
  for(var i=0;i<state.gravacoes.length;i++){
    if(state.gravacoes[i].id===id){
      try{ URL.revokeObjectURL(state.gravacoes[i].url); }catch(e){}
      state.gravacoes.splice(i,1); break;
    }
  }
  render();
}

/* ----- Previsão do tempo e conectividade real ----- */
function ensureWeather(){
  if(!state.online){ return; }
  if(state.weather || state.weatherLoading){ return; }
  state.weatherLoading=true; state.weatherStatus="";
  if(typeof navigator==="undefined" || !navigator.geolocation){ buscarTempo(null,null); return; }
  try{
    navigator.geolocation.getCurrentPosition(
      function(pos){ buscarTempo(pos.coords.latitude, pos.coords.longitude); },
      function(){ buscarTempo(null,null); },
      {timeout:8000, maximumAge:600000, enableHighAccuracy:false}
    );
  }catch(e){ buscarTempo(null,null); }
}
function buscarTempo(lat,lon){
  if(lat==null){ state.weatherLoading=false; state.weatherStatus="semlocal"; render(); return; }
  var url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=1";
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var tid=ctrl?setTimeout(function(){ try{ctrl.abort();}catch(e){} },9000):null;
  var opt=ctrl?{signal:ctrl.signal,cache:"no-store"}:{cache:"no-store"};
  try{
    fetch(url,opt).then(function(r){ return r.json(); }).then(function(d){
      if(tid) clearTimeout(tid);
      var cur=(d&&d.current)||{}, day=(d&&d.daily)||{};
      state.weather={ temp:Math.round(cur.temperature_2m), code:cur.weather_code,
        max:Math.round(((day.temperature_2m_max)||[])[0]), min:Math.round(((day.temperature_2m_min)||[])[0]) };
      state.weatherLoading=false; state.weatherStatus=""; state.online=true; render();
    }).catch(function(){ if(tid) clearTimeout(tid); state.weatherLoading=false; state.weatherStatus="erro"; render(); });
  }catch(e){ if(tid) clearTimeout(tid); state.weatherLoading=false; state.weatherStatus="erro"; render(); }
}
function weatherDescIco(code){
  var c=Number(code), W=D().weatherCodes;
  if(c===0) return {d:W.limpo, ic:"sun", cor:C.alerta};
  if(c===1||c===2) return {d:W.poucasNuvens, ic:"cloud", cor:C.agua};
  if(c===3) return {d:W.nublado, ic:"cloud", cor:C.cinza};
  if(c===45||c===48) return {d:W.neblina, ic:"cloud", cor:C.cinza};
  if(c>=51&&c<=67) return {d:W.chuva, ic:"droplets", cor:C.agua};
  if(c>=71&&c<=77) return {d:W.neve, ic:"droplets", cor:C.agua};
  if(c>=80&&c<=82) return {d:W.chuva, ic:"droplets", cor:C.agua};
  if(c>=95) return {d:W.tempestade, ic:"droplets", cor:C.mata};
  return {d:W.nublado, ic:"cloud", cor:C.agua};
}
function weatherCardHTML(){
  if(!state.online){
    return '<div class="weather-card"><span class="weather-ico" style="background:'+C.agua+'">'+icon("wifioff",24,"#fff")+'</span><div><strong>'+esc(t("weatherTitulo"))+'</strong><br><span class="wd">'+esc(t("weatherOffline"))+'</span></div></div>';
  }
  if(state.weather && state.weather.temp!=null && !isNaN(state.weather.temp)){
    var w=state.weather, wi=weatherDescIco(w.code);
    var mm=(!isNaN(w.max)&&!isNaN(w.min))?(' · '+t("weatherMax")+' '+w.max+'° / '+t("weatherMin")+' '+w.min+'°'):'';
    return '<div class="weather-card"><span class="weather-ico" style="background:'+wi.cor+'">'+icon(wi.ic,24,"#fff")+'</span>'+
      '<div><span class="wt">'+w.temp+'°C</span> <strong>'+esc(wi.d)+'</strong><br><span class="wd">'+esc(t("weatherTitulo"))+mm+'</span><br><span class="wd" style="font-size:11px">'+esc(t("weatherFonte"))+'</span></div></div>';
  }
  var msg = state.weatherStatus==="erro"?t("weatherErro"):(state.weatherStatus==="semlocal"?t("weatherSemLocal"):t("weatherCarregando"));
  return '<div class="weather-card"><span class="weather-ico" style="background:'+C.agua+'">'+icon("cloud",24,"#fff")+'</span><div><strong>'+esc(t("weatherTitulo"))+'</strong><br><span class="wd">'+esc(msg)+'</span></div></div>';
}
function checarConectividade(){
  var navOn=true; try{ navOn=(navigator&&typeof navigator.onLine==="boolean")?navigator.onLine:true; }catch(e){}
  if(!navOn){ var w0=state.online; state.online=false; if(w0) render(); return; }
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var tid=ctrl?setTimeout(function(){ try{ctrl.abort();}catch(e){} },3000):null;
  var opt=ctrl?{signal:ctrl.signal,cache:"no-store"}:{cache:"no-store"};
  try{
    fetch("https://api.open-meteo.com/v1/forecast?latitude=-15.78&longitude=-47.93&current=temperature_2m",opt)
      .then(function(){ if(tid)clearTimeout(tid); var was=state.online; state.online=true; if(!was){ render(); ensureWeather(); } })
      .catch(function(){ if(tid)clearTimeout(tid); var was=state.online; state.online=false; if(was) render(); });
  }catch(e){ if(tid)clearTimeout(tid); }
}

init();
